# Second crawl pool on GitHub-hosted runners (different IPs from the Oracle VM).
# Unlimited minutes on PUBLIC repos. This workflow never touches the database:
# it asks the web app for its shard of API-tier companies and posts snapshots back.
name: crawl
on:
  schedule:
    - cron: "17 */6 * * *" # every 6h
  workflow_dispatch:
    inputs:
      shards: { description: "number of shards", default: "4" }

concurrency: { group: crawl, cancel-in-progress: false }

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2 # stay polite: each shard is still one request at a time per domain
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @job-radar/worker...
      - name: Crawl shard
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }} # e.g. https://jobradar.example/api/ingest
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          CRAWL_CONTACT_URL: ${{ vars.CRAWL_CONTACT_URL }}
          WORKER_NAME: gha
          EMBEDDINGS: "off"
        run: pnpm worker crawl --shard ${{ matrix.shard }} --of 4
