# Job Radar on one Oracle Cloud Always Free Arm VM (linux/arm64), with the data services on Neon:
# Postgres, Auth, Realtime, AI Gateway and the `jobstats` Function live on the Neon `production` branch
# (see neon.ts). `neon deploy` writes their URLs/secrets into .env, which every service below reads.
# Local: `docker compose up -d --build`. A local Postgres is still available: `--profile localdb`.
name: job-radar

x-env: &env
  env_file: .env
  restart: unless-stopped

services:
  # Optional local database (offline development only). The app uses Neon by default.
  postgres:
    profiles: ["localdb"]
    image: pgvector/pgvector:pg16
    platform: ${PLATFORM:-linux/arm64}
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobradar}
      POSTGRES_DB: jobradar
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${PG_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar"]
      interval: 5s
      retries: 20
    # 12 GB VM: keep Postgres modest so 3–4 Chromium instances fit.
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=16MB", "-c", "max_connections=60"]

  migrate:
    <<: *env
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      platforms: ["${PLATFORM:-linux/arm64}"]
    platform: ${PLATFORM:-linux/arm64}
    restart: "no"
    command: ["pnpm", "--filter", "@job-radar/db", "migrate"] # uses DATABASE_URL_UNPOOLED from .env

  worker:
    <<: *env
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      platforms: ["${PLATFORM:-linux/arm64}"]
    platform: ${PLATFORM:-linux/arm64}
    environment:
      OLLAMA_URL: http://ollama:11434
      WORKER_NAME: oracle
    command: ["pnpm", "--filter", "@job-radar/worker", "start"]
    shm_size: 1gb # Chromium needs shared memory
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    <<: *env
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      platforms: ["${PLATFORM:-linux/arm64}"]
    platform: ${PLATFORM:-linux/arm64}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  ollama:
    image: ollama/ollama:0.5.4
    platform: ${PLATFORM:-linux/arm64}
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    profiles: ["ai"] # Phase 2 (resume parsing). Start with: docker compose --profile ai up -d

  backup:
    build:
      context: ops/backup
      platforms: ["${PLATFORM:-linux/arm64}"]
    platform: ${PLATFORM:-linux/arm64}
    <<: *env
    # Neon already has point-in-time restore; this adds an off-platform copy in R2.

  # Public HTTPS on our own domain (e.g. DuckDNS): Caddy gets/renews certificates automatically.
  # Needs ports 80 + 443 open in the cloud firewall. Set SITE_DOMAIN in .env.
  caddy:
    image: caddy:2.8.4-alpine
    platform: ${PLATFORM:-linux/arm64}
    restart: unless-stopped
    profiles: ["caddy"]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

  # Keeps <DUCKDNS_SUBDOMAIN>.duckdns.org pointed at this server's public IP (checks every 5 minutes).
  duckdns:
    image: alpine:3.20
    platform: ${PLATFORM:-linux/arm64}
    restart: unless-stopped
    profiles: ["caddy"]
    env_file: .env
    command: ["sh", "-c", "apk add -q --no-cache curl && while true; do r=$$(curl -fsS \"https://www.duckdns.org/update?domains=$${DUCKDNS_SUBDOMAIN}&token=$${DUCKDNS_TOKEN}&ip=\"); echo \"$$(date -u +%FT%TZ) duckdns $$r\"; sleep 300; done"]

  # Temporary public URL with no Cloudflare account or domain (https://<random>.trycloudflare.com).
  # The URL changes when this container restarts; use the `tunnel` profile with a real domain for production.
  quicktunnel:
    image: cloudflare/cloudflared:2024.12.2
    platform: ${PLATFORM:-linux/arm64}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:3000"]
    profiles: ["quicktunnel"]
    depends_on: [web]

  # Exposes `web` through Cloudflare without opening ports. Set CLOUDFLARE_TUNNEL_TOKEN in .env.
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    platform: ${PLATFORM:-linux/arm64}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    profiles: ["tunnel"]
    depends_on: [web]

volumes:
  pgdata:
  ollama:
  caddy_data:
  caddy_config:
